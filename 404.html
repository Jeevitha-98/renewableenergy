
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stackly Infrastructure - 404 Telemetry Disruption</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="error-root-body">

    <!-- Premium Asymmetric Terminal Plate Grid Box -->
    <main class="error-terminal-card">
        <div class="card-radar-glow-mask" id="errorTerminalGlow"></div>
        
        <!-- Top Tech Matrix Status Row -->
        <div class="error-terminal-header-row">
            <span class="error-badge-tag">// Code: 0x404 DISRUPTION</span>
            <div class="terminal-status-beacon">
                <span class="pulse-beacon-dot-red"></span>
                <span class="beacon-label-text">Uplink Lost</span>
            </div>
        </div>

        <!-- High-Impact Big Number Indicator -->
        <h1 class="error-giant-title">404</h1>
        
        <div class="error-content-block">
            <h3>Localized Path Tracking Defect Traced</h3>
            <p>
                The requested telemetry asset coordinate does not map onto our active decentralized grid topologies. The path may have expired, or the node was disconnected during a system balancing cycle.
            </p>
        </div>

        <!-- Dual Action Route Trigger Buttons Matrix (Slide from Floor Tracks) -->
        <div class="error-action-matrix-row">
            <!-- Programmatic History back latch button tracking precise segment coordinates -->
            <button id="btnErrorBackTrack" class="btn-error-action-prime">
                <span class="btn-vector-icon">↩</span>
                <span>Return to Previous Stream</span>
            </button>
            
            <!-- Standard baseline home root path navigation link -->
            <a href="index.html" class="btn-error-action-ghost">
                <span class="btn-vector-icon">🏠</span>
                <span>Return to Primary Core</span>
            </a>
        </div>

    </main>

  <style>
    /* Unique Typography Imports for Strict Brand Alignment */
@import url('https://googleapis.com');

/* Master Reset Configuration Framework Sheets */
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

.error-root-body {
    width: 100%;
    min-height: 100vh;
    background-color: #f8fafc; /* Crisp clear backdrop canvas sheet look */
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 2rem;
    position: relative;
    overflow: hidden;
}

/* Master Asymmetric Error Plate Layout Chassis */
.error-terminal-card {
    width: 100%;
    max-width: 640px;
    background-color: #ffffff;
    border: 1px solid #e2e8f0;
    border-radius: 1.5rem;
    padding: 3.5rem;
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
    position: relative;
    z-index: 10;
    box-shadow: 0 20px 50px rgba(0, 0, 0, 0.02);
    transition: border-color 0.4s ease, box-shadow 0.4s ease;
}

/* Meta Badge Component Labels Matrix */
.error-terminal-header-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    width: 100%;
    margin-bottom: 2rem;
    border-bottom: 1px solid #f1f5f9;
    padding-bottom: 1.25rem;
}

.error-badge-tag {
    font-family: 'Space Grotesk', sans-serif;
    font-size: 0.75rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    color: #ef4444; /* Image matched crimson alert warning tone variables */
}

.terminal-status-beacon {
    display: flex;
    align-items: center;
    gap: 0.4rem;
}

.pulse-beacon-dot-red {
    width: 6px;
    height: 6px;
    background-color: #ef4444;
    border-radius: 50%;
    animation: flashRedBeacon 1.5s infinite alternate;
}

@keyframes flashRedBeacon { to { transform: scale(1.35); opacity: 0.5; box-shadow: 0 0 6px #ef4444; } }

.beacon-label-text {
    font-size: 0.75rem;
    font-weight: 600;
    color: #64748b;
    text-transform: uppercase;
}

/* High impact giant typography numeric index tracking */
.error-giant-title {
    font-family: 'Space Grotesk', sans-serif;
    font-size: 7rem; /* Large impact sizing statement */
    font-weight: 700;
    color: #0c0a09;
    line-height: 1;
    letter-spacing: -0.05em;
    margin-bottom: 1.5rem;
}

.error-content-block {
    display: flex;
    flex-direction: column;
    gap: 0.75rem;
    margin-bottom: 3rem;
}

.error-content-block h3 {
    font-family: 'Space Grotesk', sans-serif;
    font-size: 1.4rem;
    font-weight: 700;
    color: #000000;
    letter-spacing: -0.02em;
}

.error-content-block p {
    font-size: 0.95rem;
    line-height: 1.6;
    color: #64748b;
    max-width: 480px;
    margin: 0 auto;
}

/* --- Dual Trigger System Action Buttons Row --- */
.error-action-matrix-row {
    display: flex;
    gap: 1.25rem;
    width: 100%;
}

.btn-error-action-prime,
.btn-error-action-ghost {
    font-family: 'Space Grotesk', sans-serif;
    font-size: 0.95rem;
    font-weight: 700;
    padding: 1rem 1.5rem;
    border-radius: 0.5rem;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 0.6rem;
    cursor: pointer;
    flex: 1;
    transition: all 0.3s cubic-bezier(0.25, 1, 0.5, 1);
    text-decoration: none;
}

.btn-error-action-prime {
    background-color: #000000; /* Minimalist strict dark chassis chassis look */
    color: #ffffff;
    border: none;
    outline: none;
}

.btn-error-action-prime:hover {
    background-color: #facc15; /* Shift to brand core yellow signature fill profile on hover */
    color: #000000;
    box-shadow: 0 10px 20px rgba(250, 204, 21, 0.2);
    transform: translateY(-1px);
}

.btn-error-action-ghost {
    background-color: #ffffff;
    border: 1px solid #cbd5e1;
    color: #0c0a09;
}

.btn-error-action-ghost:hover {
    border-color: #000000;
    background-color: #fafafa;
    transform: translateY(-1px);
}

.btn-vector-icon {
    font-size: 1rem;
    line-height: 1;
}

/* Mouse Radar Hover Coordinates Engine Glow Mask */
.card-radar-glow-mask {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    border-radius: 1.5rem;
    z-index: -1;
    background: radial-gradient(400px circle at var(--ex, 50%) var(--ey, 50%), rgba(250, 204, 21, 0.08), transparent 45%);
    transition: opacity 0.4s ease;
    pointer-events: none;
    opacity: 0;
}

.error-terminal-card:hover {
    border-color: #facc15;
    box-shadow: 0 25px 60px rgba(250, 204, 21, 0.03);
}

.error-terminal-card:hover .card-radar-glow-mask { opacity: 1; }

/* --- Fully Fluid Responsive Breakpoints System Layout Overrides --- */
@media (max-width: 640px) {
    .error-root-body {
        padding: 1rem;
    }
    .error-terminal-card {
        padding: 2.5rem 1.5rem;
    }
    .error-giant-title {
        font-size: 4.5rem;
    }
    .error-content-block h3 {
        font-size: 1.15rem;
    }
    .error-action-matrix-row {
        flex-direction: column; /* Force stack execution options vertically on mobile screen windows */
        gap: 1rem;
    }
    .btn-error-action-prime,
    .btn-error-action-ghost {
        width: 100%;
    }
}

  </style>

  

<script>
document.addEventListener('DOMContentLoaded', function () {

    // 1. Return to the exact page that opened 404.html
    
const backButton = document.getElementById('btnErrorBackTrack');

if (backButton) {
    backButton.addEventListener('click', function () {
        const savedUrl = sessionStorage.getItem('stackly_return_url');
        const savedSection = sessionStorage.getItem('stackly_return_section');

        if (savedUrl) {
            try {
                const previousUrl = new URL(savedUrl);

                if (
                    previousUrl.origin === window.location.origin &&
                    !previousUrl.pathname.toLowerCase().endsWith('/404.html')
                ) {
                    // Return to the original dashboard URL
                    window.location.href = previousUrl.href;

                    // Restore the selected dashboard tab after navigation
                    if (savedSection) {
                        sessionStorage.setItem(
                            'stackly_restore_section',
                            savedSection
                        );
                    }

                    return;
                }
            } catch (error) {
                console.error('Invalid dashboard return URL:', error);
            }
        }

        window.location.href = 'login.html';
    });
}

    // 2. Radar glow effect
    const glowElement = document.getElementById('errorTerminalGlow');
    const errorCard = glowElement ? glowElement.parentElement : null;

    if (errorCard) {
        errorCard.addEventListener('mousemove', function (event) {
            const rect = errorCard.getBoundingClientRect();

            errorCard.style.setProperty(
                '--ex',
                (event.clientX - rect.left) + 'px'
            );

            errorCard.style.setProperty(
                '--ey',
                (event.clientY - rect.top) + 'px'
            );
        });

        errorCard.addEventListener('mouseleave', function () {
            errorCard.style.setProperty('--ex', '50%');
            errorCard.style.setProperty('--ey', '50%');
        });
    }

});
</script>


</body>
</html>
